server {
  server_name api2.cairovm.codes;

  listen 443 ssl;
  http2 on;

  ssl_certificate /etc/letsencrypt/live/api2.cairovm.codes/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api2.cairovm.codes/privkey.pem;
  

  # Gzip Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2 font/woff;
  gzip_min_length 1000;

  # Security Headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  charset utf-8;
  proxy_hide_header X-Powered-By;
  server_tokens off;

  set $cairovm_server_url http://app:3000;

  location / {
    # Handle CORS Preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Add directives for WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Proxy to backend server
    proxy_pass $cairovm_server_url;
    limit_req zone=api_limit burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
  }
}