[package]
name = "prover"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
prover = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "c91bbd0056ebb4b862ccc325a4550d01d609dec0", package = "stwo_cairo_prover", default-features = false }
stwo-cairo-serialize = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "c91bbd0056ebb4b862ccc325a4550d01d609dec0", package = "stwo-cairo-serialize", default-features = false }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "c91bbd0056ebb4b862ccc325a4550d01d609dec0", package = "stwo-cairo-adapter", features = ["std"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.139"

