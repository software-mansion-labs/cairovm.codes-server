version: "3.8"

services:
  app:
    build: .
    expose:
      - "3000"
    networks:
      - app-network

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - cert_data:/etc/letsencrypt         # Shared volume for certificates
      - webroot:/var/www/certbot             # Shared webroot for Certbot challenge
    depends_on:
      - app
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - cert_data:/etc/letsencrypt         # Shared volume for certificate data
      - webroot:/var/www/certbot             # Webroot for challenge verification
    # This entrypoint runs a loop that renews the certificates every 12 hours.
    entrypoint: >
      sh -c "trap exit TERM; while :; do
             certbot renew;
             sleep 12h & wait \$${!};
             done"
    networks:
      - app-network

volumes:
  cert_data:
  webroot:

networks:
  app-network:
    driver: bridge
