[workspace]
members = ["crates/server", "crates/cairo1-run", "crates/tracer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
axum = "0.6.20"
anyhow = "1.0.89"
tower = "0.4.13"
tower-http = { version = "0.4.4", features = ["cors", "trace"] }
tokio = { version = "1.33.0", features = ["full"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.104"
url = "2.4.0"
rand = "0.8.5"
starknet-types-core = { version = "0.1.0", features = [
  "hash",
  "prime-bigint",
  "serde",
] }
cairo-vm = { version = "1.0.1", features = ["cairo-1-hints"] }

cairo-lang-compiler = { version = "=2.8.0", default-features = false }
cairo-lang-sierra = { version = "=2.8.0", default-features = false }
cairo-lang-sierra-type-size = { version = "=2.8.0", default-features = false }
cairo-lang-sierra-to-casm = { version = "=2.8.0", default-features = false }
cairo-lang-sierra-ap-change = { version = "=2.8.0", default-features = false }
cairo-lang-sierra-gas = { version = "=2.8.0", default-features = false }
cairo-lang-sierra-generator = { version = "=2.8.0", default-features = false }
cairo-lang-starknet = { version = "=2.8.0", default-features = false }
cairo-lang-runner = { version = "=2.8.0", default-features = false }
cairo-lang-casm = { version = "=2.8.0", default-features = false }
cairo-lang-utils = { version = "=2.8.0", default-features = false }
cairo-lang-diagnostics = { version = "=2.8.0", default-features = false }
cairo-lang-syntax = { version = "=2.8.0", default-features = false }
cairo-lang-filesystem = { version = "=2.8.0", default-features = false }
cairo-lang-test-plugin = { version = "=2.8.0", default-features = false }

